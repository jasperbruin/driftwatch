# src/prometheus/prometheus.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["0.0.0.0:9090"]


  - job_name: recommendationservice
    static_configs:
      - targets: ['recommendationservice:9090']

  - job_name: erbdetector
    static_configs:
      - targets: ['erbdetector:5005']




