apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftsimulator
  labels:
    app: driftsimulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftsimulator
  template:
    metadata:
      labels:
        app: driftsimulator
    spec:
      containers:
      - name: driftsimulator
        image: driftsimulator
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: driftsimulator
spec:
  type: ClusterIP
  selector:
    app: driftsimulator
  ports:
    - port: 80
      targetPort: 5000
